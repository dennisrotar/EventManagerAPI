version: '3.8'

services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookings_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5435:5432"

  # ─────────────────────────── Кеш (Redis) ───────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  # ─────────────────────────── Микросервисы ───────────────────────────
  users-api:
    build:
      context: .
      dockerfile: Services/Users/Users.Api/Dockerfile
    container_name: eventapi-users-api
    depends_on:
      users-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=users-db;Port=5432;Database=users_db;Username=admin;Password=password
      - Jwt__Secret=SUPER_SECRET_KEY_FOR_EVENT_MANAGER_2024_VERY_LONG
      - Jwt__Issuer=EventManager
      - Jwt__Audience=EventManagerUsers
    ports:
      - "5001:8080"

  events-api:
    build:
      context: .
      dockerfile: Services/Events/Events.Api/Dockerfile
    container_name: eventapi-events-api
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=events-db;Port=5432;Database=events_db;Username=admin;Password=password
      - ConnectionStrings__Redis=redis:6379 # <--- Добавлено
      - Jwt__Secret=SUPER_SECRET_KEY_FOR_EVENT_MANAGER_2024_VERY_LONG
      - Jwt__Issuer=EventManager
      - Jwt__Audience=EventManagerUsers
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ConsumerGroup=events-service-group
    ports:
      - "5002:8080"

  bookings-api:
    build:
      context: .
      dockerfile: Services/Bookings/Bookings.Api/Dockerfile
    container_name: eventapi-bookings-api
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=bookings-db;Port=5432;Database=bookings_db;Username=admin;Password=password
      - Jwt__Secret=SUPER_SECRET_KEY_FOR_EVENT_MANAGER_2024_VERY_LONG
      - Jwt__Issuer=EventManager
      - Jwt__Audience=EventManagerUsers
      - Kafka__BootstrapServers=kafka:29092
    ports:
      - "5003:8080"

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data: